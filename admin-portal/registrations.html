<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrations | Silver Oak University</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">
  <div class="logo-bar"><img src="images/logo-light.png" alt="Silver Oak University - Education to Innovation"></div>
  <nav class="admin-navbar"><span class="brand">🎓 Admin Dashboard — Silver Oak University</span><div class="nav-links"><a class="active" href="dashboard.html">Dashboard</a><a href="events.html">Events</a><button class="btn-logout" onclick="logout()">Logout</button></div></nav>
  <main class="dashboard-container">
    <div id="page-message"></div>
    <section class="section-card event-page-content">
      <div class="event-toolbar">
        <div>
          <div id="event-breadcrumb" class="event-breadcrumb">Loading event...</div>
          <p id="event-info" class="event-info"></p>
        </div>
        <div class="event-toolbar">
          <label for="event-picker">Event</label>
          <select id="event-picker" class="event-picker"></select>
          <button id="refresh-btn" class="btn-admin" type="button">↻ Refresh</button>
        </div>
      </div>
      <nav class="tab-bar" aria-label="Event administration">
        <a class="active" id="registrations-tab" href="#">Registrations</a>
        <a id="payments-tab" href="#">Payments</a>
        <a id="attendance-tab" href="#">Attendance</a>
      </nav>
      <div class="section-heading"><h1>Registrations</h1><span id="registration-count">0 registrations</span></div>
      <div class="form-group"><label for="registration-search">Search registrations</label><input id="registration-search" type="search" placeholder="Name, enrollment or ticket code"></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Student Name</th><th>Enrollment No</th><th>Email</th><th>Phone</th><th>College</th><th>Department</th><th>Branch</th><th>Div</th><th>Participation</th><th>Ticket</th><th>Payment</th><th>Attendance</th></tr></thead>
          <tbody id="registrations-body"><tr><td colspan="13" class="status-message">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/api-base.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/registrations.js"></script>
</body>
</html>
