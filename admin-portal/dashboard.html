<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Silver Oak University</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">
  <div class="logo-bar"><img src="images/logo-light.png" alt="Silver Oak University - Education to Innovation"></div>
  <nav class="admin-navbar">
    <span class="brand">🎓 Admin Dashboard — Silver Oak University</span>
    <div class="nav-links">
      <a class="active" href="dashboard.html">Dashboard</a>
      <a href="events.html">Events</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>
  <main class="dashboard-container">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-number" id="stat-events">0</div><div class="stat-label">Total Events</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-registrations">0</div><div class="stat-label">Total Registrations</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-departments">0</div><div class="stat-label">Departments Covered</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-pending">0</div><div class="stat-label">Pending Payments</div></div>
      <div class="stat-card"><div class="stat-number" id="stat-present">0</div><div class="stat-label">Checked In</div></div>
    </div>
    <section class="section-card">
      <div class="section-heading"><h1>Events Overview</h1><a class="btn-admin" href="events.html">Manage Events</a></div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>#</th><th>Event</th><th>Date</th><th>Type</th><th>Fee</th><th>Registrations</th><th>Paid / Pending</th><th>Present</th><th>Actions</th></tr></thead>
          <tbody id="events-body"><tr><td colspan="9" class="status-message">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="js/api-base.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
